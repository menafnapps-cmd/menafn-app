workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menafn.menafn-newsfeed-ios-app
      vars:
        APP_STORE_APPLE_ID: "1255148674"
    scripts:
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix Xcode Project and Podfile targets
        script: |
          python3 -c "
          import glob, re
          
          # 1. Update bundle ID and deployment target globally across all project configurations
          for path in glob.glob('ios/Runner.xcodeproj/project.pbxproj'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('com.menafn.menafn', 'com.menafn.menafn-newsfeed-ios-app')
              content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = \d+\.\d+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', content)
              
              with open(path, 'w') as f:
                  f.write(content)

          # 2. Force explicit bundle identifier in Info.plist to override any old values
          for path in glob.glob('ios/Runner/Info.plist'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('com.menafn.menafn', 'com.menafn.menafn-newsfeed-ios-app')
              
              # If CFBundleIdentifier bundle key exists, ensure it's explicitly set
              if '<key>CFBundleIdentifier</key>' not in content:
                  content = content.replace('<dict>', '<dict>\n\t<key>CFBundleIdentifier</key>\n\t<string>com.menafn.menafn-newsfeed-ios-app</string>')
              
              with open(path, 'w') as f:
                  f.write(content)

          # 3. Remove RunnerTests target cleanly from Podfile
          for path in glob.glob('ios/Podfile'):
              with open(path, 'r') as f:
                  lines = f.readlines()
              
              new_lines = []
              skip = False
              for line in lines:
                  if \"target 'RunnerTests' do\" in line:
                      skip = True
                      continue
                  if skip and 'end' in line:
                      skip = False
                      continue
                  if not skip:
                      new_lines.append(line)
                      
              with open(path, 'w') as f:
                  f.writelines(new_lines)
          "
      - name: Install Pods explicitly
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
          cd ..
      - name: Set up code signing files
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-pub