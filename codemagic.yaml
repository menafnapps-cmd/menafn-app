workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menafn.menafn-newsfeed-ios-app
      vars:
        APP_STORE_APPLE_ID: "1255148674"
    scripts:
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix Xcode Project and Podfile targets
        script: |
          python3 -c "..."
      - name: Install Pods explicitly
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
          cd ..
      - name: Set up code signing files
        script: |
          xcode-project use-profiles

      # --- 📍 مكان وضع الكود الجديد هنا قبل بناء ملف الـ IPA ---
      - name: Create App Store Connect API Key file
        script: |
          mkdir -p ~/.private_keys
          cat << 'EOF' > ~/.private_keys/AuthKey_6C4XD9Y3FZ.p8
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQgsCONgwjLEH6A0U3J
          rb8iyVYN8GXn3Wuh/1z+bXUKqzugCgYIKoZIzj0DAQehRANCAAR+2wYZ/nyYjo2Q
          mzFLN838tGP2mGIJcpuxgbyk2fjs0yTi3T6NqnT9RrraxxDXyjQLuXc+TcQUiIuX
          wiMpsPgR
          -----END PRIVATE KEY-----
          EOF

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-pub --dart-define=BUNDLE_ID=com.menafn.menafn-newsfeed-ios-app --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: "6C4XD9Y3FZ"
        issuer_id: "69a6de92-f802-47e3-e053-5b8c7c11a4d1"
        submit_to_testflight: true