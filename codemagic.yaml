workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menafn.menafn-newsfeed-ios-app
      vars:
        APP_STORE_APPLE_ID: "1255148674"
    scripts:
      - name: Disable Swift Package Manager to fix CocoaPods conflict
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Fix Xcode Project and Podfile targets
        script: |
          python3 -c "
          import glob, re
          
          # 1. Update bundle ID in project.pbxproj
          for path in glob.glob('ios/Runner.xcodeproj/project.pbxproj'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('com.menafn.menafn', 'com.menafn.menafn-newsfeed-ios-app')
              content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = \d+\.\d+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', content)
              with open(path, 'w') as f:
                  f.write(content)

          # 2. Update Flutter generated xcconfig files which override bundle ids
          for path in glob.glob('ios/Flutter/*.xcconfig'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('com.menafn.menafn', 'com.menafn.menafn-newsfeed-ios-app')
              with open(path, 'w') as f:
                  f.write(content)

          # 3. Force explicit bundle identifier in Info.plist
          for path in glob.glob('ios/Runner/Info.plist'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('com.menafn.menafn', 'com.menafn.menafn-newsfeed-ios-app')
              with open(path, 'w') as f:
                  f.write(content)

          # 4. Remove RunnerTests target cleanly from Podfile
          for path in glob.glob('ios/Podfile'):
              with open(path, 'r') as f:
                  lines = f.readlines()
              new_lines = [line for line in lines if \"target 'RunnerTests' do\" not in line]
              with open(path, 'w') as f:
                  f.writelines(new_lines)
          "
      - name: Install Pods explicitly
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod install --repo-update
          cd ..
      - name: Set up code signing files
        script: |
          xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          flutter build ipa --release --no-pub --dart-define=BUNDLE_ID=com.menafn.menafn-newsfeed-ios-app
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        apple_id: "1255148674"