workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.menafn.menafn-newsfeed-ios-app
    scripts:
      - name: Disable Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Update bundle identifier, deployment target, and version 4.3
        script: |
          python3 -c "
          import glob, re
          # تحديث ملفات الأكسارك (الـ Bundle ID والـ Deployment Target)
          for path in glob.glob('ios/Runner.xcodeproj/project.pbxproj'):
              with open(path, 'r') as f:
                  content = f.read()
              content = content.replace('PRODUCT_BUNDLE_IDENTIFIER = com.menafn.menafn;', 'PRODUCT_BUNDLE_IDENTIFIER = com.menafn.menafn-newsfeed-ios-app;')
              content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = \d+\.\d+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', content)
              with open(path, 'w') as f:
                  f.write(content)

          # تحديث رقم الإصدار إلى 4.3 ورقم البناء إلى 54 في Info.plist
          for path in glob.glob('ios/Runner/Info.plist'):
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r'<key>CFBundleShortVersionString</key>\s*<string>.*?</string>', '<key>CFBundleShortVersionString</key><string>4.3</string>', content)
              content = re.sub(r'<key>CFBundleVersion</key>\s*<string>.*?</string>', '<key>CFBundleVersion</key><string>54</string>', content)
              with open(path, 'w') as f:
                  f.write(content)
          "
      - name: Set up code signing files
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Clean build cache
        script: |
          flutter clean
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa